<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- SEO -->
    {% seo %}
    
    <!-- Feed -->
    {% feed_meta %}
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
</head>
<body>
    <div id="wrapper">
        <div id="header">
            <div id="branding">
                <div id="site-title">
                    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
                </div>
                <div id="site-description">
                    Department of Computer Science, Federal University of Minas Gerais, Belo Horizonte, Brazil
                </div>
            </div>
        </div>

        <div id="access" role="navigation">
            <div class="menu-header">
                <ul id="menu-navigation" class="menu">
                    <li><a href="{{ '/' | relative_url }}">Home</a></li>
                    <li><a href="{{ '/members/' | relative_url }}">Members</a></li>
                    <li><a href="{{ '/publications/' | relative_url }}">Publications</a></li>
                    <li><a href="{{ '/theses/' | relative_url }}">Theses</a></li>
                    <li><a href="{{ '/software/' | relative_url }}">Software and Datasets</a></li>
                    <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
                </ul>
            </div>
        </div>

        <div id="main">
            <div id="container">
                <div id="content" role="main">
                    {{ content }}
                </div>
            </div>
        </div>

        <div id="footer">
            <div id="colophon">
                <div id="site-info">
                    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
                </div>
                <div id="site-generator">
                    Proudly powered by Jekyll.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
