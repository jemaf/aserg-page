title: Applied Software Engineering Research Group
description: Department of Computer Science, Federal University of Minas Gerais, Belo Horizonte, Brazil
author: ASERG
email: aserg@dcc.ufmg.br
url: "http://aserg.labsoft.dcc.ufmg.br"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  posts:
    output: true
    permalink: /:collection/:title/
  publications:
    output: false
  publications_ptbr:
    output: false
    directory: publications-ptbr
  theses:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Your Name"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Dockerfile
  - docker-compose.yml
  - .dockerignore 